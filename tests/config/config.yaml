# Causal mutation rate:
mu: 1.7e-10

# Chromosome
chromosome: 1
# Chromosome arm
arm: z

# SLiM seed
slim_seed: 100
# Demography for simulation
# This is the name of the YAML file that is in "resources/demography" directory
demography: "relate_OutOfAfrica_4J17_ceu"

# Number of YRI individuals in the final output
YRI_number: 10
# Number of CEU individuals in the final output
CEU_number: 10
# Number of CHB individuals in the final output
CHB_number: 10
# Number of JPT individuals in the final output
JPT_number: 10
# Seed that is used to extract individuals
individual_seed: 10

# Seed that is used in recapitation
recapitate_seed: 99

# Neutral mutation rate
neutral_mu: 1.7e-8
# Seed that is used in neutral simulation
neutral_seed: 12

# Proportion of causal variants to take in genetic value simulation
proportion: 1
# Seed that is used in genetic value simulation
genetic_seed: 15

# MAF threshold that is used in VCZ generation
maf: 0.001


# These parameters are important for simulations
# but they do not need to be modified

# Recombination position file
recombination_position: "resources/recombination_map/recombination_position.csv"
# Selection scaling parameter
scaling_selection: 1e10

# flashpca directory - This will be called in snakemake to run flashpca
flashpca: "/homes/tagami/software/flashpca/flashpca"

# Comparison with 1000 Genomes
# Number of founder individuals in the 1000 Genomes Project
thousand_yri_num: 121
thousand_jpt_num: 104
thousand_chb_num: 103
thousand_ceu_num: 122


# 1000 Genomes analysis
# CSV file with 1000 Genomes founder individual IDs
thousand_yri_founder: "/homes/tagami/1000genomes/founder_pop_yri.txt"
thousand_ceu_founder: "/homes/tagami/1000genomes/founder_pop_ceu.txt"
thousand_chb_founder: "/homes/tagami/1000genomes/founder_pop_chb.txt"
thousand_jpt_founder: "/homes/tagami/1000genomes/founder_pop_jpt.txt"


# PopLDdecay directory - This will be called in snakemake to run PopLDdecay
PopLDdecay: "/homes/tagami/software/PopLDdecay/bin/PopLDdecay"

# GWAS parameters
# Threshold of PC1
PC1: 0
# Number of CEU individuals to take in the simulation
num_ceu_gwas: 360390

gwas_phenotype: "height_simulation"

# Manc-COJO directory - This will be called in snakemake to run Manc-COJO
Manc-COJO: "/homes/tagami/software/manc_cojo"
